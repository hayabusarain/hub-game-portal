<style>

  * { box-sizing: border-box; }

  p { margin: 0 0 12px; }
  a { color: var(--accent); }
  ul { list-style: none; margin: 20px 0; padding: 0; display: grid; gap: 10px; }
  li a { display: block; padding: 12px 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--card); color: var(--heading); text-decoration: none; }
  li a:hover, li a:focus-visible { border-color: var(--accent); background: var(--accent-soft); }
  .muted { color: var(--muted); font-size: 0.9rem; }
</style>
